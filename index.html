<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIRITO — 3D Solarpunk Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas WebGL -->
    <canvas class="webgl"></canvas>

    <!-- 2D HUD: Top Glassmorphism Navigation -->
    <header class="hud-header">
      <div class="brand-logo">
        <span class="logo-accent">KIRITO</span>
        <span class="logo-sub">.3D</span>
      </div>

      <nav class="hud-nav">
        <button class="nav-item active" data-target="world">World</button>
        <button class="nav-item" data-target="about">About (West)</button>
        <button class="nav-item" data-target="skills">Skills (North)</button>
        <button class="nav-item" data-target="projects">Projects (East)</button>
        <button class="nav-item" data-target="contact">Connect</button>
      </nav>
    </header>

    <!-- 2D HUD: Petunjuk Kontrol Third-Person Action & Flight -->
    <div class="hud-hint">
      <span class="hint-icon">🌌</span>
      <span><strong>WASD:</strong> Move | <strong>E:</strong> Toggle Flight | <strong>Space/C:</strong> Fly Up/Down | <strong>F / Click:</strong> Slash Combo | <strong>Drag/Scroll:</strong> Orbit & Zoom</span>
    </div>

    <!-- 2D Modal Pop-Up Window -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-container">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title-text">Section Title</h2>
          <button id="modal-close-btn" class="modal-close-button">&times;</button>
        </div>
        <div id="modal-body" class="modal-scroll-body"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
